<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画时 · 管理</title>
<style>
:root { --ink: #111; --mute: #666; --line: #ddd; --bg: #f6f5f2; --card: #fff; --accent: #1f4e8c; --bad: #b3261e; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 6px; max-width: 980px; margin: 0 auto; }
header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
header small { color: var(--mute); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #aaa; margin-right: 5px; vertical-align: 1px; }
.dot.on { background: #2e7d32; }
main, #login { max-width: 980px; margin: 0 auto; padding: 0 12px 40px; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; font-size: 15px; color: var(--mute); border-bottom: 2px solid transparent; cursor: pointer; }
nav.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
h2 { font-size: 16px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 18px 0 8px; }
.hint { color: var(--mute); font-size: 13px; margin: 6px 0; }
.warn { color: var(--bad); font-size: 13px; margin: 6px 0; }
button, .button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 7px; border: 1px solid #bbb; background: #fff; color: var(--ink); cursor: pointer; display: inline-block; }
button:hover, .button:hover { border-color: #888; }
button.primary, .button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
button.danger { color: var(--bad); border-color: #e0b4b0; }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea { font: inherit; font-size: 15px; padding: 7px 9px; border: 1px solid #bbb; border-radius: 7px; background: #fff; color: var(--ink); width: 100%; }
textarea { resize: vertical; line-height: 1.6; }
label { display: block; margin: 8px 0; font-size: 13px; color: var(--mute); }
label > input, label > textarea, label > select { margin-top: 3px; color: var(--ink); }
label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 15px; margin: 4px 14px 4px 0; }
label.inline input { width: auto; margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.screen { text-align: center; }
.screen img, .preview img { width: 100%; max-width: 600px; image-rendering: pixelated; border: 1px solid #999; background: #fff; display: block; margin: 0 auto; aspect-ratio: 4 / 3; }
.now-line { text-align: center; margin: 8px 0 14px; }
.now-line b { font-size: 16px; }
.seg { display: inline-flex; border: 1px solid #999; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.seg label { margin: 0; padding: 7px 16px; color: var(--ink); font-size: 15px; cursor: pointer; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--ink); color: #fff; }
.shares { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink); }
.shares input { width: 64px; }
.pick { display: flex; gap: 12px; align-items: center; }
.pick img { width: 96px; height: 72px; object-fit: cover; border: 1px solid var(--line); background: #eee; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; display: flex; flex-direction: column; }
.tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #eee; display: block; cursor: pointer; }
.tile .meta { padding: 7px 9px 4px; flex: 1; }
.tile .meta b { display: block; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .meta small { color: var(--mute); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eee; color: #444; }
.badge.dark { background: var(--ink); color: #fff; }
.badge.off { background: #f3d9d6; color: var(--bad); }
.tile .actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px 9px; }
.tile .actions button { font-size: 12px; padding: 3px 8px; }
.toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 4px; }
.toolbar select { width: auto; }
.more { display: block; margin: 14px auto; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; overflow-y: auto; padding: 18px 10px; }
.sheet { background: var(--card); max-width: 760px; margin: 0 auto; border-radius: 12px; padding: 14px 16px 18px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.sheet-head b { font-size: 17px; }
.sheet-head button { border: 0; font-size: 22px; line-height: 1; padding: 4px 8px; }
.pages { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0 4px; }
.pages button { font-size: 13px; padding: 3px 10px; }
.pages button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: sticky; bottom: -18px; background: var(--card); padding: 10px 0 4px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; padding: 6px 12px 8px; }
legend { font-size: 13px; color: var(--mute); padding: 0 4px; }
input[type=range] { width: 100%; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 40; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: .95; }
#toast.bad { background: var(--bad); }
.empty { color: var(--mute); padding: 18px; text-align: center; border: 1px dashed #ccc; border-radius: 9px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } .toolbar { grid-template-columns: 1fr 1fr; } .toolbar input { grid-column: 1 / -1; } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header><h1>画时</h1><small id="conn"></small></header>

<div id="login" hidden>
  <div class="card" style="max-width:360px;margin:40px auto">
    <h2>请输入管理密码</h2>
    <form id="login-form">
      <input type="password" id="login-pw" autocomplete="current-password" placeholder="密码">
      <p class="warn" id="login-msg"></p>
      <button class="primary" type="submit">进入</button>
    </form>
  </div>
</div>

<main id="app" hidden>
  <nav class="tabs">
    <button data-tab="now" class="on">现在</button>
    <button data-tab="mine">我的图库</button>
    <button data-tab="catalog">名画目录</button>
    <button data-tab="settings">设置</button>
  </nav>

  <section id="tab-now">
    <div class="screen"><img id="screen" alt="屏幕预览"></div>
    <div class="now-line" id="now-line"></div>
    <div class="card">
      <h2>播放方式</h2>
      <div class="seg">
        <label><input type="radio" name="mode" value="rotate">轮播</label>
        <label><input type="radio" name="mode" value="fixed">固定一幅</label>
      </div>
      <div id="rotate-opts">
        <label>换画间隔
          <select id="interval"></select>
        </label>
        <label>名画和我的图的比例</label>
        <div class="shares">名画 <input type="number" id="cshare" min="0" max="20" inputmode="numeric"> ： <input type="number" id="gshare" min="0" max="20" inputmode="numeric"> 我的图</div>
        <p class="hint" id="share-hint"></p>
      </div>
      <div id="fixed-opts">
        <div class="pick" id="fixed-pick"></div>
        <p class="hint">在「我的图库」「名画目录」或下面的「最近显示」里点「固定」，就换成那一幅。</p>
      </div>
      <p><button class="primary" id="apply">应用</button> <span class="hint" id="apply-hint"></span></p>
    </div>
    <h3>最近显示</h3>
    <div class="grid" id="recent"></div>
  </section>

  <section id="tab-mine" hidden>
    <div class="card">
      <label class="button primary" style="color:#fff;margin:0">添加图片<input type="file" id="upload" accept="image/*" multiple hidden></label>
      <span class="hint" id="upload-msg"></span>
      <p class="hint">图片会转成灰度显示在屏幕上方的横幅里。横图裁成横幅，竖图默认整幅显示、两边留白；添加后可以调裁切位置、写标题和讲解。</p>
    </div>
    <div class="grid" id="gallery"></div>
    <h3>内置的画</h3>
    <div class="grid" id="builtins"></div>
  </section>

  <section id="tab-catalog" hidden>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题、画家、博物馆、英文名…">
      <select id="group"></select>
      <select id="only">
        <option value="">全部</option>
        <option value="edited">改过的</option>
        <option value="skip">不轮播的</option>
      </select>
    </div>
    <p class="hint" id="cat-count"></p>
    <div class="grid" id="catalog"></div>
    <button class="more" id="more" hidden>显示更多</button>
  </section>

  <section id="tab-settings" hidden>
    <div class="card">
      <h2>管理密码</h2>
      <p class="hint" id="pw-state"></p>
      <label id="pw-current-row">当前密码<input type="password" id="pw-current" autocomplete="current-password"></label>
      <label>新密码<input type="password" id="pw-new" autocomplete="new-password" placeholder="留空 = 不用密码"></label>
      <p><button class="primary" id="pw-save">保存密码</button> <button id="logout" hidden>退出登录</button></p>
    </div>
    <div class="card">
      <h2>关于</h2>
      <p class="hint">名画目录共 <span id="about-count"></span> 幅，图片来自 Wikimedia Commons（公有领域）。设置、自己的图和改过的讲解保存在运行时钟的机器上，更新程序不会丢。</p>
    </div>
  </section>
</main>

<div class="modal" id="editor" hidden>
  <div class="sheet">
    <div class="sheet-head"><b id="ed-head">编辑</b><button id="ed-close" title="关闭">×</button></div>
    <div class="preview"><img id="ed-img" alt="预览"></div>
    <div class="pages" id="ed-pages"></div>
    <p class="hint" style="text-align:center">预览按屏幕的 16 级灰度模拟；改动要点「保存」才会生效。</p>
    <p class="warn" id="ed-warn"></p>
    <fieldset id="ed-crop">
      <legend>画面</legend>
      <label class="inline"><input type="checkbox" id="ed-whole">整幅显示（不裁切，两边留白）</label>
      <label id="ed-focus-row">裁切位置（往左偏上，往右偏下）<input type="range" id="ed-focus" min="0" max="1" step="0.01"></label>
    </fieldset>
    <p class="hint" id="ed-wide" hidden>这幅画比横幅还宽，总是整幅显示，上方留白。</p>
    <label>标题<input type="text" id="f-title"></label>
    <div class="row2">
      <label>作者<input type="text" id="f-artist"></label>
      <label>年代<input type="text" id="f-year"></label>
    </div>
    <label>作者简介<input type="text" id="f-artist_about" placeholder="例如：荷兰后印象派画家（1853－1890）"></label>
    <div class="row2">
      <label>类型<input type="text" id="f-genre"></label>
      <label>流派<input type="text" id="f-movement"></label>
      <label>材质<input type="text" id="f-medium"></label>
      <label>尺寸<input type="text" id="f-dimensions"></label>
    </div>
    <label>收藏<input type="text" id="f-museum"></label>
    <label>讲解标题<input type="text" id="f-intro_heading" placeholder="讲解"></label>
    <label>讲解（每行一段）<textarea id="f-intro" rows="10"></textarea></label>
    <label>讲解出处（显示在讲解下方，可留空）<input type="text" id="f-intro_source"></label>
    <div class="sheet-foot">
      <button class="primary" id="ed-save">保存</button>
      <button id="ed-fix">固定显示这幅</button>
      <button id="ed-skip"></button>
      <button id="ed-revert" hidden>恢复原文</button>
      <button class="danger" id="ed-delete" hidden>删除这张图</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const FIELDS = ['title', 'artist', 'year', 'artist_about', 'genre', 'movement', 'medium', 'dimensions', 'museum', 'intro_heading', 'intro', 'intro_source'];
const INTERVALS = [[1440, '每天'], [720, '每 12 小时'], [360, '每 6 小时'], [180, '每 3 小时'], [120, '每 2 小时'], [60, '每小时'], [30, '每 30 分钟'], [15, '每 15 分钟']];
const PAGE = 48;
let state = null, catalog = null, shown = PAGE, screenKey = null, screenAt = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const credit = w => [w.artist, w.year].filter(Boolean).join(' · ');
const thumb = key => '/thumb?key=' + encodeURIComponent(key);

class LoginNeeded extends Error {}

async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if (r.status === 401) { showLogin(); throw new LoginNeeded('需要登录'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('出错了（' + r.status + '）'));
  return data;
}

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', bad ? 5000 : 2600);
}
function report(e) { if (!(e instanceof LoginNeeded)) toast(e.message, true); }

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#login-pw').focus(); }

$('#login-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('#login-msg').textContent = '';
  try {
    await api('/api/login', { password: $('#login-pw').value });
    $('#login').hidden = true;
    $('#login-pw').value = '';
    start();
  } catch (e) { $('#login-msg').textContent = e.message; }
});

document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => openTab(b.dataset.tab)));
function openTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  for (const t of ['now', 'mine', 'catalog', 'settings']) $('#tab-' + t).hidden = t !== name;
  if (name === 'catalog' && !catalog) loadCatalog();
}

async function start() {
  $('#app').hidden = false;
  await refresh();
}

async function refresh() {
  try {
    state = await api('/api/state');
  } catch (e) { report(e); return; }
  renderState();
}

function onScreenKey() {
  if (state.showing) return state.showing.key;
  if (state.settings.mode === 'fixed' && state.fixed) return state.fixed.key;
  const now = state.recent.find(r => r.when === 'now') || state.recent.find(r => r.when === 'past');
  return now ? now.key : (state.builtins[0] || {}).key;
}

function renderState() {
  const s = state;
  $('#conn').innerHTML = s.connected ? '<span class="dot on"></span>设备已连接' : '<span class="dot"></span>设备未连接' + (s.offline ? ' · 离线模式' : '');
  const key = onScreenKey();
  if (key && (key !== screenKey || Date.now() - screenAt > 60000)) drawScreen(key);
  const showing = s.showing || s.recent.find(r => r.key === key) || s.builtins.find(b => b.key === key);
  $('#now-line').innerHTML = showing
    ? `<b>《${esc(showing.title)}》</b> <span class="hint">${esc(credit(showing))}</span><br>
       <button data-edit="${esc(showing.key)}">编辑标题和讲解</button>` + (s.connected ? '' : '<p class="hint">设备没连上时，这里是它连上后会显示的画面。</p>')
    : '';
  if (!dirty) fillPlayback();
  renderTiles($('#recent'), s.recent.filter(r => r.when !== 'next').slice(0, 12), r => [r.slot], '还没有显示过的画');
  renderTiles($('#gallery'), s.gallery, g => g.skip ? [['不轮播', 'off']] : [], '图库还是空的。点上面的「添加图片」。', true);
  renderTiles($('#builtins'), s.builtins, () => ['内置']);
  $('#pw-state').textContent = s.has_password ? '已设密码。打开这个页面要先输入密码。' : '还没设密码：同一个局域网里的人都能打开这个页面。';
  $('#pw-current-row').hidden = !s.has_password;
  $('#logout').hidden = !s.has_password;
  $('#about-count').textContent = s.catalog_size;
}

let dirty = false;
function fillPlayback() {
  const s = state.settings;
  document.querySelectorAll('input[name=mode]').forEach(r => r.checked = r.value === s.mode);
  const sel = $('#interval');
  const opts = INTERVALS.some(([m]) => m === s.interval) ? INTERVALS : [...INTERVALS, [s.interval, '每 ' + s.interval + ' 分钟']];
  sel.innerHTML = opts.map(([m, t]) => `<option value="${m}">${t}</option>`).join('');
  sel.value = s.interval;
  $('#cshare').value = s.catalog_share;
  $('#gshare').value = s.gallery_share;
  pendingFixed = s.fixed;
  showPlayback();
}

let pendingFixed = null;
function showPlayback() {
  const mode = document.querySelector('input[name=mode]:checked')?.value || 'rotate';
  $('#rotate-opts').hidden = mode !== 'rotate';
  $('#fixed-opts').hidden = mode !== 'fixed';
  const c = +$('#cshare').value || 0, g = +$('#gshare').value || 0, n = state.gallery.filter(x => !x.skip).length;
  let hint;
  if (c > 0 && g > 0) hint = `每 ${c + g} 幅里放 ${c} 幅名画、${g} 幅我的图。`;
  else if (g === 0 && c > 0) hint = '只放名画。';
  else if (c === 0 && g > 0) hint = '只放我的图。';
  else hint = '两边都是 0 时只放我的图。';
  if (g > 0 && n === 0) hint += '我的图库里还没有参加轮播的图，先都放名画。';
  if (mode === 'rotate') hint += ' 下一次换画：' + state.next_change + '。';
  $('#share-hint').textContent = hint;
  const f = pendingFixed && (findWork(pendingFixed) || { key: pendingFixed, title: pendingFixed });
  $('#fixed-pick').innerHTML = f
    ? `<img src="${thumb(f.key)}" alt=""><div><b>《${esc(f.title)}》</b><br><span class="hint">${esc(credit(f))}</span></div>`
    : '<span class="hint">还没选要固定的画。</span>';
}
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { dirty = true; showPlayback(); }));
['#interval', '#cshare', '#gshare'].forEach(s => $(s).addEventListener('input', () => { dirty = true; showPlayback(); }));

function findWork(key) {
  const all = [...state.gallery, ...state.builtins, ...state.recent, ...(catalog || [])];
  if (state.fixed) all.push(state.fixed);
  return all.find(w => w.key === key);
}

function playback(overrides) {
  const mode = document.querySelector('input[name=mode]:checked')?.value || 'rotate';
  return Object.assign({
    mode,
    interval: +$('#interval').value,
    catalog_share: Math.max(0, Math.min(20, Math.round(+$('#cshare').value || 0))),
    gallery_share: Math.max(0, Math.min(20, Math.round(+$('#gshare').value || 0))),
    fixed: pendingFixed,
  }, overrides);
}

async function saveSettings(settings, done) {
  try {
    state = await api('/api/settings', settings);
    dirty = false;
    renderState();
    toast(done || '已应用，屏幕马上更新');
    screenAt = 0;
    setTimeout(refresh, 4000);
  } catch (e) { report(e); }
}

$('#apply').addEventListener('click', async () => {
  const b = $('#apply');
  b.disabled = true;
  await saveSettings(playback());
  b.disabled = false;
});

async function fix(key, title) {
  toast('正在准备《' + (title || key) + '》…');
  pendingFixed = key;
  await saveSettings(playback({ mode: 'fixed', fixed: key }), '已固定显示《' + (title || key) + '》');
}

async function setSkip(key, skip) {
  try {
    await api('/api/skip', { key, skip });
    toast(skip ? '这幅不再参加轮播' : '这幅重新参加轮播');
    const c = catalog && catalog.find(w => w.key === key);
    if (c) { c.skip = skip; renderCatalog(); }
    await refresh();
  } catch (e) { report(e); }
}

async function drawScreen(key) {
  screenKey = key;
  screenAt = Date.now();
  try {
    const r = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, page: 0 }) });
    if (!r.ok) return;
    const img = $('#screen');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(await r.blob());
  } catch (e) { /* the next refresh tries again */ }
}

function renderTiles(box, works, badges, empty, own) {
  if (!works.length) { box.innerHTML = empty ? `<div class="empty">${esc(empty)}</div>` : ''; return; }
  box.innerHTML = works.map(w => {
    const tags = (badges(w) || []).map(b => Array.isArray(b) ? `<span class="badge ${b[1]}">${esc(b[0])}</span>` : `<span class="badge">${esc(b)}</span>`).join('');
    const fixed = state.settings.mode === 'fixed' && state.settings.fixed === w.key ? '<span class="badge dark">固定中</span>' : '';
    const rotating = w.skip !== undefined;
    return `<div class="tile">
      <img loading="lazy" src="${thumb(w.key)}" alt="" data-edit="${esc(w.key)}">
      <div class="meta"><b>${esc(w.title)}</b><small>${esc(credit(w)) || '&nbsp;'}</small><div class="badges">${fixed}${tags}</div></div>
      <div class="actions">
        <button data-edit="${esc(w.key)}">编辑</button>
        <button data-fix="${esc(w.key)}">固定</button>
        ${rotating ? `<button data-skip="${esc(w.key)}" data-on="${w.skip ? 0 : 1}">${w.skip ? '恢复轮播' : '不轮播'}</button>` : ''}
        ${own ? `<button class="danger" data-delete="${esc(w.key)}">删除</button>` : ''}
      </div></div>`;
  }).join('');
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-edit],[data-fix],[data-skip],[data-delete]');
  if (!t) return;
  if (t.dataset.edit) openEditor(t.dataset.edit);
  else if (t.dataset.fix) fix(t.dataset.fix, (findWork(t.dataset.fix) || {}).title);
  else if (t.dataset.skip) setSkip(t.dataset.skip, t.dataset.on === '1');
  else if (t.dataset.delete) remove(t.dataset.delete);
});

async function remove(key) {
  const w = findWork(key);
  if (!confirm('删除《' + (w ? w.title : key) + '》？删除后不能恢复。')) return;
  try {
    await api('/api/delete', { key });
    toast('已删除');
    closeEditor();
    await refresh();
  } catch (e) { report(e); }
}

// Phones send big photos, sometimes in formats the server cannot read; the
// browser turns them into a moderate JPEG first and applies the EXIF rotation.
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s);
    c.height = Math.round(img.naturalHeight * s);
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.92));
  } catch (e) {
    return file;
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('#upload').addEventListener('change', async ev => {
  const files = [...ev.target.files];
  ev.target.value = '';
  if (!files.length) return;
  const msg = $('#upload-msg');
  let last = null, ok = 0;
  for (const [i, file] of files.entries()) {
    msg.textContent = `正在上传 ${i + 1}/${files.length}：${file.name}`;
    try {
      const body = await shrink(file);
      const title = file.name.replace(/\.[^.]+$/, '');
      const r = await fetch('/api/upload?title=' + encodeURIComponent(title), { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) throw new Error(file.name + '：' + (data.error || r.status));
      last = data.key;
      ok++;
    } catch (e) { toast(e.message, true); }
  }
  msg.textContent = ok ? `已添加 ${ok} 张。轮到时会显示；想马上看，点「固定」。` : '';
  await refresh();
  if (ok === 1 && last) openEditor(last);
});

async function loadCatalog() {
  $('#cat-count').textContent = '正在载入目录…';
  try {
    catalog = await api('/api/catalog');
  } catch (e) { report(e); return; }
  const groups = {};
  catalog.forEach(w => groups[w.group] = (groups[w.group] || 0) + 1);
  $('#group').innerHTML = '<option value="">所有分类</option>' + Object.entries(groups).sort((a, b) => b[1] - a[1])
    .map(([g, n]) => `<option value="${esc(g)}">${esc(g)}（${n}）</option>`).join('');
  renderCatalog();
}

function catalogMatches() {
  const terms = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const group = $('#group').value, only = $('#only').value;
  return catalog.filter(w => {
    if (group && w.group !== group) return false;
    if (only === 'edited' && !w.edited) return false;
    if (only === 'skip' && !w.skip) return false;
    const text = [w.key, w.title, w.artist, w.year, w.group, w.museum, ...(w.original || [])].join(' ').toLowerCase();
    return terms.every(t => text.includes(t));
  });
}

function renderCatalog() {
  if (!catalog) return;
  const list = catalogMatches();
  const skipped = catalog.filter(w => w.skip).length;
  $('#cat-count').textContent = `找到 ${list.length} 幅（目录共 ${catalog.length} 幅${skipped ? '，其中 ' + skipped + ' 幅不轮播' : ''}）`;
  renderTiles($('#catalog'), list.slice(0, shown), w => [w.group, ...(w.edited ? ['改过'] : []), ...(w.skip ? [['不轮播', 'off']] : [])], '没有找到');
  $('#more').hidden = list.length <= shown;
}
let searchTimer;
$('#q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { shown = PAGE; renderCatalog(); }, 200); });
$('#group').addEventListener('change', () => { shown = PAGE; renderCatalog(); });
$('#only').addEventListener('change', () => { shown = PAGE; renderCatalog(); });
$('#more').addEventListener('click', () => { shown += PAGE; renderCatalog(); });

// Editor
let ed = null, edPage = 0, renderSeq = 0, previewTimer;

async function openEditor(key) {
  ed = null;
  $('#editor').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#ed-head').textContent = '载入中…';
  $('#ed-warn').textContent = '';
  $('#ed-img').removeAttribute('src');
  $('#ed-pages').innerHTML = '';
  try {
    fillEditor(await api('/api/work?key=' + encodeURIComponent(key)));
  } catch (e) {
    $('#ed-head').textContent = '打不开';
    $('#ed-warn').textContent = e.message;
  }
}

function fillEditor(w) {
  ed = w;
  const m = w.meta;
  $('#ed-head').textContent = (w.own ? '我的图' : w.builtin ? '内置的画' : '名画') + ' · ' + m.title;
  for (const f of FIELDS) $('#f-' + f).value = m[f] || '';
  $('#ed-crop').hidden = w.wide;
  $('#ed-wide').hidden = !w.wide;
  $('#ed-whole').checked = !!m.whole;
  $('#ed-focus').value = w.focus ?? 0.5;
  $('#ed-focus-row').hidden = !!m.whole;
  const warn = [];
  if (w.flat) warn.push('明暗层次很少，上屏可能看不清。');
  else if (w.muddy) warn.push(`中间灰占 ${Math.round(w.midtones * 100)}%，上屏可能发灰。`);
  $('#ed-warn').textContent = warn.join(' ');
  $('#ed-revert').hidden = !(w.edited && !w.own);
  $('#ed-delete').hidden = !w.own;
  $('#ed-skip').textContent = w.skip ? '恢复轮播' : '不参加轮播';
  $('#ed-skip').hidden = w.builtin;
  edPage = 0;
  preview();
}

function collect() {
  const e = {};
  for (const f of FIELDS) e[f] = $('#f-' + f).value;
  e.whole = $('#ed-whole').checked;
  e.focus = ed.wide ? null : +$('#ed-focus').value;
  return e;
}

async function preview() {
  if (!ed) return;
  const seq = ++renderSeq;
  try {
    const r = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: ed.key, edit: collect(), page: edPage }) });
    if (seq !== renderSeq) return;
    if (!r.ok) { $('#ed-warn').textContent = (await r.json().catch(() => ({}))).error || '预览失败'; return; }
    const pages = +r.headers.get('X-Pages') || 1;
    const blob = await r.blob();
    if (seq !== renderSeq) return;
    const img = $('#ed-img');
    if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(blob);
    const names = ['时钟', '整幅'];
    for (let i = 2; i <= pages; i++) names.push('介绍 ' + (i - 1));
    $('#ed-pages').innerHTML = names.map((n, i) => `<button data-page="${i}" class="${i === edPage ? 'on' : ''}">${n}</button>`).join('');
  } catch (e) { /* a later edit renders again */ }
}
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(preview, 350); }

$('#ed-pages').addEventListener('click', ev => {
  const b = ev.target.closest('[data-page]');
  if (!b) return;
  edPage = +b.dataset.page;
  preview();
});
for (const f of FIELDS) $('#f-' + f).addEventListener('input', schedulePreview);
$('#ed-focus').addEventListener('input', schedulePreview);
$('#ed-whole').addEventListener('change', () => { $('#ed-focus-row').hidden = $('#ed-whole').checked; preview(); });

function closeEditor() {
  $('#editor').hidden = true;
  document.body.style.overflow = '';
  ed = null;
}
$('#ed-close').addEventListener('click', closeEditor);
$('#editor').addEventListener('click', ev => { if (ev.target.id === 'editor') closeEditor(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#editor').hidden) closeEditor(); });

$('#ed-save').addEventListener('click', async () => {
  if (!ed) return;
  try {
    const w = await api('/api/work', { key: ed.key, edit: collect() });
    toast('已保存，屏幕马上更新');
    fillEditor(w);
    updateCatalogItem(w);
    screenAt = 0;
    await refresh();
  } catch (e) { report(e); }
});
$('#ed-revert').addEventListener('click', async () => {
  if (!ed || !confirm('丢掉改动，恢复成目录里的原文？')) return;
  try {
    const w = await api('/api/revert', { key: ed.key });
    toast('已恢复原文');
    fillEditor(w);
    updateCatalogItem(w);
    screenAt = 0;
    await refresh();
  } catch (e) { report(e); }
});
$('#ed-fix').addEventListener('click', () => ed && fix(ed.key, ed.meta.title));
$('#ed-skip').addEventListener('click', async () => {
  if (!ed) return;
  await setSkip(ed.key, !ed.skip);
  ed.skip = !ed.skip;
  $('#ed-skip').textContent = ed.skip ? '恢复轮播' : '不参加轮播';
});
$('#ed-delete').addEventListener('click', () => ed && remove(ed.key));

function updateCatalogItem(w) {
  const c = catalog && catalog.find(x => x.key === w.key);
  if (!c) return;
  Object.assign(c, { title: w.meta.title, artist: w.meta.artist, year: w.meta.year, edited: w.edited });
  renderCatalog();
}

// Settings
$('#pw-save').addEventListener('click', async () => {
  const next = $('#pw-new').value;
  if (!next && state.has_password && !confirm('新密码留空会取消密码，局域网里的人都能打开这个页面。确定吗？')) return;
  try {
    await api('/api/password', { current: $('#pw-current').value, new: next });
    $('#pw-current').value = $('#pw-new').value = '';
    toast(next ? '密码已设好' : '已取消密码');
    await refresh();
  } catch (e) { report(e); }
});
$('#logout').addEventListener('click', async () => {
  await api('/api/logout', {}).catch(() => {});
  showLogin();
});

setInterval(() => { if (!document.hidden && !$('#app').hidden) refresh(); }, 30000);
start();
</script>
